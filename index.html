<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/calculater.svg">
</head> 
<body>
    
        <div class="container">
            <div class="display">
                <input id="screen" type="text" placeholder="0">
            </div>

            <div class="btns">
                <div class="row">
                    <button aria-label="degree mode">DEG</button>
                    <button aria-label="fix/float exponent mode">F-E</button>
                    <button aria-label="Memory clear" >MC</button>
                    <button aria-label="Memory recall">MR</button>
                    <button aria-label="Memory add">M+</button>
                    <button aria-label="Memory subtract">M-</button>
                </div>

                <div class="row">
                    <button class="btn" aria-label="clear sign">C</button>
                    <button aria-label="Memory store">MS</button>
                    <button class="btn" aria-label="">(</button>
                    <button class="btn" aria-label="">)</button>
                    <button class="btn" aria-label="">x<sup>2</sup></button>
                    <button aria-label=""><img src="assets/images/backspace.svg" alt="backspace" id="backspace"></button>
                </div>

                <div class="row">
                    <button class="btn" aria-label="percentage sign">%</button>
                    <button aria-label="x power 2">x<sup>2</sup></button>
                    <button aria-label="x power y">x<sup>y</sup></button>
                    <button aria-label="10 power x">10<sup>x</sup></button>
                    <button aria-label="exponent function">exp</button>
                    <button aria-label="modulus function">mod</button>
                </div>

                <div class="row">
                    <button aria-label="absolute value">|x|</button>
                    <button aria-label="">2<sup>nd</sup></button>
                    <button aria-label=" n logarithm">ln</button>
                    <button aria-label="add sub toggle">+/-</button>
                    <button aria-label="floor function">floor</button>
                    <button aria-label="ceil function">ceil</button>
                </div>

                <div class="row">
                    <button aria-label="trignometry sin">sin</button>
                    <button aria-label="math pi function">π</button>
                    <button class="btn" aria-label="number 7">7</button>
                    <button class="btn" aria-label="number 8">8</button>
                    <button class="btn" aria-label="number 9">9</button>
                    <button class="btn" aria-label="division sign">÷</button>
                </div>

                <div class="row">
                    <button aria-label="trignometry cos">cos</button>
                    <button aria-label="logarithm">log</button>
                    <button class="btn"  aria-label="number 4">4</button>
                    <button class="btn" aria-label="number 5">5</button>
                    <button class="btn" aria-label="number 6">6</button>
                    <button class="btn" aria-label="multiply sign">×</button>
                </div>

                <div class="row">
                    <button aria-label="trignometry tan">tan</button>
                    <button aria-label="root sign">√</button>
                    <button class="btn" aria-label="number 1">1</button>
                    <button class="btn" aria-label="number 2">2</button>
                    <button class="btn" aria-label="number 3">3</button>
                    <button class="btn" aria-label="minus sign">-</button>
                </div>

                <div class="row">
                    <button aria-label="Eular's number">e</button>
                    <button aria-label="factorial">n!</button>
                    <button class="btn" aria-label="number zero">0</button>
                    <button class="btn" aria-label="decimal point">.</button>
                    <button aria-label="equals">=</button>
                    <button class="btn" aria-label="plus sign">+</button>
                </div>
            </div>
        </div>
</body>   
</html>
